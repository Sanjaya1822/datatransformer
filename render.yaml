services:
  - type: web
    name: datatransformer
    env: python
    plan: free
    region: singapore
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn data_transformer.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CANDIDATE_MATCH_THRESHOLD
        value: "0.85"
      - key: UNCERTAIN_MATCH_THRESHOLD
        value: "0.50"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
